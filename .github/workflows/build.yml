# Static gates on every pull request. Nothing here builds the warehouse: bronze is loaded from a
# SQL Server that CI has no access to, and this repository ships no data to build on instead.
# The dbt tests run on a developer machine after `make extract`.

name: build

on:
  pull_request:
  push:
    branches: [main, phase2]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Dummy values: `dbt parse` renders the profile but never connects, and nothing else here
    # touches a database. Not repository secrets -- they guard nothing.
    env:
      CATALOG_USER: ci
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly: setup-uv publishes no floating tag past v7, and v10 targets node 24.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: make install

      - name: Lint, import boundaries, types and unit tests
        run: make check

      # Compiling the dbt project needs no containers and catches a bad ref, a Jinja error or a
      # YAML mistake before merge -- the only dbt signal left now that CI does not build. No
      # profile step: `make` points dbt at the repository's own profiles.yml.
      - run: make deps
      - run: make parse
