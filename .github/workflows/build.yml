# Every pull request runs `make check`: lint, import boundaries, types, unit tests, and
# `make build_empty` -- every dbt model, data test and unit test, built against the engine on a
# local lake that holds the raw schema and no rows. What it cannot see is the data itself: raw is
# loaded from a SQL Server CI has no access to, so row-level checks still run after `make extract`.

name: build

on:
  pull_request:
  push:
    branches: [main]

# Reads the repository and nothing else: no step publishes, comments or writes back.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly: setup-uv publishes no floating tag past v7, and v10 targets node 24.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: make install

      # No database, no secrets: the dbt target `empty` attaches a lake built from
      # src/ingestion/raw_schema.sql and needs no variable. See `make build_empty`.
      - name: Lint, import boundaries, types, unit tests, and dbt on an empty raw
        run: make check
