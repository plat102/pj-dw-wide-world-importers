# The storage layer: an S3-compatible object store and the DuckLake catalog.
#
# This is the only file in the repository that names either product. Everything above it sees
# s3:// paths and environment variables. Why it is built this way, and what each retry loop is
# for, is written up in the project's documentation repository under docs/storage/.
#
#   make up             start it and create the bucket
#   make down           stop it, keeping the data
#   make clean_storage  stop it and delete the data

services:
  s3:
    image: chrislusf/seaweedfs:4.41
    # One process runs master, volume, filer and the S3 gateway. The identity file is rendered
    # here from the environment so no key is ever committed; without one the gateway answers 403.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        sed -e "s|__ACCESS_KEY__|$${S3_ACCESS_KEY}|" \
            -e "s|__SECRET_KEY__|$${S3_SECRET_KEY}|" \
            /etc/seaweedfs/s3-identities.template.json > /tmp/s3-identities.json
        exec weed server -dir=/data -s3 -s3.port=8333 \
          -s3.config=/tmp/s3-identities.json \
          -master.volumeSizeLimitMB=1024 -volume.max=10
    environment:
      # No defaults: an unset credential must stop the stack, not start one with a guessable value.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY -- copy .env.example to .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY -- copy .env.example to .env}
    ports:
      - "${S3_PORT:-8333}:8333"   # S3 API -- the only port this repo uses
      - "9333:9333"               # master UI
      - "8888:8888"               # filer
    volumes:
      - s3-data:/data
      - ./storage/s3-identities.template.json:/etc/seaweedfs/s3-identities.template.json:ro
    healthcheck:
      # 127.0.0.1, not localhost: weed binds IPv4 only and busybox wget tries ::1 first.
      # Coarse on purpose -- `make up` waits on a real write; see scripts/wait_for_storage.py.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Creating the bucket is part of starting the stack, not a step someone has to remember.
  # Retries because the filer serves bucket commands later than the healthcheck goes green, and
  # `weed shell` exits 0 even when it failed.
  s3-init:
    image: chrislusf/seaweedfs:4.41
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        attempt=0
        until printf 's3.bucket.list\n' | weed shell -master=s3:9333 2>/dev/null \
              | grep -qw "$${S3_BUCKET}"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -gt 30 ]; then
            echo "bucket $${S3_BUCKET} still absent after $$attempt attempts" >&2
            exit 1
          fi
          printf 's3.bucket.create -name %s\n' "$${S3_BUCKET}" \
            | weed shell -master=s3:9333 2>&1 | sed 's/^/  /' || true
          sleep 2
        done
        echo "bucket $${S3_BUCKET} exists"
    environment:
      S3_BUCKET: ${S3_BUCKET:-wwi}
    restart: "no"

  # DuckLake catalog. Postgres rather than a file, because a catalog nobody else can reach does
  # not make a lakehouse; in cloud this is a managed database.
  catalog:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CATALOG_USER:?set CATALOG_USER -- copy .env.example to .env}
      POSTGRES_PASSWORD: ${CATALOG_PASSWORD:?set CATALOG_PASSWORD -- copy .env.example to .env}
      POSTGRES_DB: ${CATALOG_DB:-ducklake}
    ports:
      - "${CATALOG_PORT:-55432}:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

# Named, so `down` keeps the data. Deleting it takes `make clean_storage`.
volumes:
  s3-data:
  catalog-data:
