# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR), then fill in project and keyfile.
# The top-level key must match `profile:` in wide_world_importers_dw/dbt_project.yml.
# Never commit the filled-in file: it points at a service-account key.
# Docs: https://docs.getdbt.com/docs/get-started/connection-profiles

wide_world_importers_dw:
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: <gcp-project-id>
      keyfile: /absolute/path/to/service-account.json
      dataset: "wwi" # prefix of dataset name if schema specified in project/models
      location: asia-southeast1
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
      threads: 4
  target: dev
