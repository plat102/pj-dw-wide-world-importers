# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR). The top-level key must match `profile:`
# in dbt_project.yml. Every value comes from the environment, so there is nothing to fill in.

wide_world_importers_dw:
  outputs:
    # Default target: snapshot in, DuckLake out -- Parquet on the store, catalog in Postgres.
    # `path` is in-memory because the warehouse lives in the lake, not in a local file.
    lake:
      type: duckdb
      path: ":memory:"
      # Not a placeholder: concurrent writes make DuckLake commits conflict, and it costs nothing
      # because the build is bound by S3 round trips.
      threads: 1
      extensions:
        - httpfs
        - ducklake
        - postgres
      attach:
        # One connection string, assembled from the environment. The catalog is a real database,
        # so anything that can reach it and the bucket sees the same warehouse.
        - path: >-
            ducklake:postgres:dbname={{ env_var('CATALOG_DB', 'ducklake') }}
            host={{ env_var('CATALOG_HOST', 'localhost') }}
            port={{ env_var('CATALOG_PORT', '55432') }}
            user={{ env_var('CATALOG_USER') }}
            password={{ env_var('CATALOG_PASSWORD') }}
          alias: lake
          options:
            # Both halves must attach the same lake, and that now means the same catalog metadata:
            # bronze is a schema in it. Stated rather than inherited from the role's search path,
            # so dlt and dbt provably agree -- see settings.METADATA_SCHEMA.
            metadata_schema: public
            data_path: "s3://{{ env_var('S3_BUCKET', 'wwi') }}/{{ env_var('LAKE_PREFIX', 'lake') }}/"
      database: lake
      schema: main
      secrets:
        - type: s3
          key_id: "{{ env_var('S3_ACCESS_KEY') }}"
          secret: "{{ env_var('S3_SECRET_KEY') }}"
          endpoint: "{{ env_var('S3_ENDPOINT', 'localhost:8333') }}"
          url_style: path
          use_ssl: "{{ env_var('S3_USE_SSL', 'false') }}"
  target: lake
