# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR).
# The top-level key must match `profile:` in wide_world_importers_dw/dbt_project.yml.
# The default target is `duckdb` and needs no credential at all -- nothing to fill in.
# Only the `dev` (BigQuery) target needs a project and a keyfile; never commit that filled-in file.
# Docs: https://docs.getdbt.com/docs/get-started/connection-profiles

wide_world_importers_dw:
  outputs:
    # Phase 2 target. Reads the Parquet snapshot; writes a local database file.
    # Relative paths resolve against the working directory, and the Makefile runs dbt
    # from the repository root, so this lands next to the Makefile.
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'wwi.duckdb') }}"
      threads: 4
    dev:
      type: bigquery
      method: service-account
      project: <gcp-project-id>
      keyfile: /absolute/path/to/service-account.json
      dataset: "wwi" # prefix of dataset name if schema specified in project/models
      location: asia-southeast1
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
      threads: 4
  target: duckdb
