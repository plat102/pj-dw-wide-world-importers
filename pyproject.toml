[project]
name = "wide-world-importers-dw"
version = "0.2.0"
description = "Kimball star schema over the Wide World Importers sample OLTP"
# 3.12 is what the local interpreter, uv.lock and CI all run. Widen it by adding a version to the
# quality job's matrix first.
requires-python = ">=3.12"

dependencies = [
    # transform
    "dbt-core==1.12.2",
    "dbt-duckdb",             # the warehouse engine; version left to the resolver
    "duckdb",
    # extract: MSSQL -> Parquet on the object store
    "dlt[sql-database]>=1.7.0",
    "s3fs>=2024.6",           # dlt's filesystem destination cannot write s3:// without it
    "pymssql>=2.3",           # not pyodbc: needs ODBC Driver 18, broken on WSL2
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# src/ is a marker directory, not a package: each subdirectory under it is a top-level package.
package-dir = {"" = "src"}
packages = [
    "cli", "config", "connectors", "contracts", "ingestion", "utils", "warehouse",
]

[tool.setuptools.package-data]
ingestion = ["tables.yml"]

[project.scripts]
wwi = "cli.app:main"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

# The project's defining invariant, as a build failure: the extraction half holds the source
# credential and nothing downstream may acquire the means to reach the source. `make lint` runs it.
[tool.importlinter]
root_packages = ["cli", "config", "connectors", "contracts", "ingestion", "utils", "warehouse"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the mssql connector may reach the source database"
type = "forbidden"
# Bans the capability, not the module, so a *new* connection opened elsewhere is caught too.
# `cli` is absent on purpose: it is the dispatcher, and it imports each subcommand's dependencies
# only when that subcommand is chosen -- see the PLC0415 exemption for that file.
source_modules = [
    "config", "contracts", "utils", "warehouse",
    "connectors.s3", "connectors.ducklake",
    "ingestion.verify",
]
forbidden_modules = ["dlt", "sqlalchemy", "pymssql"]

[[tool.importlinter.contracts]]
name = "The transform half cannot import the source connector"
type = "forbidden"
source_modules = ["warehouse", "contracts", "config", "utils"]
forbidden_modules = ["connectors.mssql"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "cli",
    "ingestion | warehouse",
    "connectors",
    "contracts",
    "config",
    "utils",
]

[tool.uv]
# uv.lock is the source of truth. Regenerate with `uv lock`, install with `uv sync`.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "PL",     # pylint
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# The long line is the `external_location` template this module emits verbatim: output, not
# source, and a trailing `# noqa` would land in sources.yml.
"src/contracts/dbt_sources.py" = ["E501"]
# Lazy imports on purpose: `wwi shape` must not pay for sqlalchemy and dlt, and keeping the source
# driver off the default import path is the same boundary the import-linter contracts enforce.
"src/cli/app.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
# Checks the annotations rather than demanding new ones; tighten once the untyped edges are gone.
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib, so test modules mirroring the package tree may share a basename.
addopts = "--import-mode=importlib -q"
# Integration tests skip themselves when the lake is unreachable, so `make test` needs no stack.
markers = ["integration: needs the object store, the catalog and a seeded snapshot"]
