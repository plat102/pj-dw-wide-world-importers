# Tables the lake's bronze schema carries: exactly the ones a model reads, added in the same
# change as the model that needs them. Columns are named, not `*`, so the schema is deliberate.

tables:
  - source: Application.Cities
    output: application__cities
    columns:
      - CityID
      - CityName
      - StateProvinceID
      - LatestRecordedPopulation
      - LastEditedBy
      - ValidFrom
      - ValidTo

  - source: Application.Countries
    output: application__countries
    columns:
      - CountryID
      - CountryName
      - FormalName
      - IsoAlpha3Code
      - IsoNumericCode
      - CountryType
      - LatestRecordedPopulation
      - Continent
      - Region
      - Subregion
      - LastEditedBy
      - ValidFrom
      - ValidTo

  - source: Application.DeliveryMethods
    output: application__delivery_methods
    columns:
      - DeliveryMethodID
      - DeliveryMethodName
      - LastEditedBy
      - ValidFrom
      - ValidTo

