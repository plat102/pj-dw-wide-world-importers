name: 'wide_world_importers_dw'
version: '1.0.0'

# Must match the top-level key in ../profiles.yml.
profile: 'wide_world_importers_dw'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Per-directory defaults. A model overrides them with its own `{{ config(...) }}` only when it
# needs something different -- see docs/naming_convention.md.
models:
  wide_world_importers_dw:
    # One view per source table: renames and casts, no joins.
    staging:
      +materialized: view
      +schema: stg
    # Joins reused by more than one downstream model.
    intermediate:
      +materialized: view
      +schema: stg
    # The star schema.
    analytics:
      +materialized: table
      +schema: dwh
    # The published, denormalised surface.
    marts:
      +materialized: table
      +schema: mart
