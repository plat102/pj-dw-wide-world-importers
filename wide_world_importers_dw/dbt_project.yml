name: 'wide_world_importers_dw'
version: '1.0.0'

# Must match the top-level key in ../profiles.yml.
profile: 'wide_world_importers_dw'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Per-directory defaults. A model overrides them with its own `{{ config(...) }}` only when it
# needs something different -- see docs/naming_convention.md.
models:
  wide_world_importers_dw:
    # One view per source table: renames only, source semantics kept.
    staging:
      +materialized: view
      +schema: staging
    # Joins reused by more than one downstream model -- or about to be.
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      # The star: conformed dimensions and the fact they hang off.
      core:
        +schema: core
