# Hand-written. Bronze is a schema of the lake this project builds into, so a source here is an
# ordinary relation dbt resolves by name. No column lists: the catalog knows the types, and
# src/ingestion/tables.yml is where the column contract is declared and checked.
version: 2

sources:
  - name: wwi_raw
    description: >
      Wide World Importers OLTP, loaded into the lake by `make extract`. One table per entry in
      src/ingestion/tables.yml. Every row carries dlt's `_dlt_load_id`, the unix timestamp of the
      load that wrote it, which staging turns into `processed_at`.
    # The alias the profile attaches the lake under, and dlt's dataset inside it. Literal names:
    # `+schema:` in dbt_project.yml governs models, not sources.
    database: lake
    schema: bronze
    loader: dlt
    tables:
      - name: application__cities
      - name: application__countries
      - name: application__delivery_methods
      - name: application__people
      - name: application__state_provinces
      - name: purchasing__supplier_categories
      - name: purchasing__suppliers
      - name: sales__buying_groups
      - name: sales__customer_categories
      - name: sales__customers
      - name: sales__order_lines
      - name: sales__orders
      - name: warehouse__colors
      - name: warehouse__package_types
      - name: warehouse__stock_items
