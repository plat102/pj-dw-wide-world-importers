version: 2

# Staging only renames and casts, so each model must agree on row count with its bronze table.
# Named rather than derived: `people` and `cities` do not follow from the singular mechanically.
models:
  - name: stg_application_city
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'application__cities') }}"

  - name: stg_application_country
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'application__countries') }}"

  - name: stg_application_delivery_method
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'application__delivery_methods') }}"

  - name: stg_application_person
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'application__people') }}"

  - name: stg_application_state_province
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'application__state_provinces') }}"

  - name: stg_purchasing_supplier
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'purchasing__suppliers') }}"

  - name: stg_purchasing_supplier_category
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'purchasing__supplier_categories') }}"

  - name: stg_sales_buying_group
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'sales__buying_groups') }}"

  - name: stg_sales_customer
    description: "One row per customer, renamed from Sales.Customers."
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'sales__customers') }}"

  - name: stg_sales_customer_category
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'sales__customer_categories') }}"

  - name: stg_sales_order
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'sales__orders') }}"

  - name: stg_sales_order_line
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'sales__order_lines') }}"

  - name: stg_warehouse_color
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'warehouse__colors') }}"

  - name: stg_warehouse_package_type
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'warehouse__package_types') }}"

  - name: stg_warehouse_stock_item
    data_tests:
      - matches_bronze_rowcount:
          arguments:
            bronze_relation: "{{ source('wwi_raw', 'warehouse__stock_items') }}"
