version: 2

# Staging only renames and casts, so each model must agree on row count with its raw table.
# Named rather than derived: `people` and `cities` do not follow from the singular mechanically.
models:
  - name: stg_application__cities
    description: "Cities. The only geography grain the source keys addresses on. One view over `raw.application__cities`: renames only -- no joins, no casts, no filter."
    data_tests:
      - matches_source_rowcount:
          arguments:
            source_relation: "{{ source('wwi_raw', 'application__cities') }}"

  - name: stg_application__countries
    description: "Countries, with formal name and entity type. One view over `raw.application__countries`: renames only -- no joins, no casts, no filter."
    data_tests:
      - matches_source_rowcount:
          arguments:
            source_relation: "{{ source('wwi_raw', 'application__countries') }}"

  - name: stg_application__delivery_methods
    description: "Ways goods leave the warehouse. One view over `raw.application__delivery_methods`: renames only -- no joins, no casts, no filter."
    data_tests:
      - matches_source_rowcount:
          arguments:
            source_relation: "{{ source('wwi_raw', 'application__delivery_methods') }}"

  - name: stg_application__people
    description: "Everyone the source knows: system users, employees, customer contacts. One view over `raw.application__people`: renames only -- no joins, no casts, no filter."
    data_tests:
      - matches_source_rowcount:
          arguments:
            source_relation: "{{ source('wwi_raw', 'application__people') }}"

  - name: stg_application__state_provinces
    description: "States and provinces, each inside a country. One view over `raw.application__state_provinces`: renames only -- no joins, no casts, no filter."
    data_tests:
      - matches_source_rowcount:
          arguments:
            source_relation: "{{ source('wwi_raw', 'application__state_provinces') }}"

  - name: stg_purchasing__suppliers
    description: "Suppliers the warehouse buys from. One view over `raw.purchasing__suppliers`: renames only -- no joins, no casts, no filter."
    data_tests:
