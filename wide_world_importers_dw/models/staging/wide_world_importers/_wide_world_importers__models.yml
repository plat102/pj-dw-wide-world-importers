  - name: stg_sales__customers
    description: "Customers, with both addresses and both contacts. One view over `raw.sales__customers`: renames only -- no joins, no casts, no filter."
    data_tests:
      - matches_source_rowcount:
          arguments:
            source_relation: "{{ source('wwi_raw', 'sales__customers') }}"

  - name: stg_sales__customer_categories
    description: "How customers are grouped. One view over `raw.sales__customer_categories`: renames only -- no joins, no casts, no filter."
