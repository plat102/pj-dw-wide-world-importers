            source_relation: "{{ source('wwi_raw', 'purchasing__supplier_categories') }}"

  - name: stg_sales__buying_groups
    description: "Buying groups customers may belong to. One view over `raw.sales__buying_groups`: renames only -- no joins, no casts, no filter."
    data_tests:
      - matches_source_rowcount:
